name: Notify the Agentic Law Journal Editor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notify-agentic-law-journal-editor
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check mail configuration
        id: mail
        env:
          SMTP_USERNAME: ${{ secrets.ALJ_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.ALJ_SMTP_PASSWORD }}
          NOTIFICATION_TO: ${{ secrets.ALJ_NOTIFICATION_TO }}
        run: |
          if [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$NOTIFICATION_TO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Set ALJ_SMTP_USERNAME, ALJ_SMTP_PASSWORD, and ALJ_NOTIFICATION_TO to enable email notifications."
          fi

      # The cache contains manuscript numbers only. It prevents repeated mail
      # without publishing pending-submission metadata in the repository.
      - name: Restore notification state
        if: steps.mail.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .notification-state
          key: alj-notifications-bootstrap
          restore-keys: |
            alj-notifications-

      - name: Email new submissions
        id: notify
        if: steps.mail.outputs.enabled == 'true'
        env:
          API_BASE: https://niccoloridi.com
          AYIL_ADMIN_KEY: ${{ secrets.AYIL_ADMIN_KEY }}
          SMTP_HOST: ${{ vars.ALJ_SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.ALJ_SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.ALJ_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.ALJ_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.ALJ_SMTP_FROM }}
          ALJ_NOTIFICATION_TO: ${{ secrets.ALJ_NOTIFICATION_TO }}
        run: python3 .github/scripts/notify-journal.py

      - name: Save notification state
        if: steps.notify.outputs.state_changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .notification-state
          key: alj-notifications-${{ steps.notify.outputs.state_hash }}
