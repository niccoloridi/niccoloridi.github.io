    <text x="0" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="81" font-weight="600" letter-spacing="-3" fill="#ece8df">NICCOLÒ<tspan fill="#d7a13b">.</tspan></text>
    <text x="0" y="173" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="81" font-weight="600" letter-spacing="-3" fill="#ece8df">RIDI</text>
    <line x1="2" y1="207" x2="532" y2="207" stroke="#d7a13b" stroke-opacity=".48"/>
    <text x="0" y="249" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#ece8df" fill-opacity=".84">International adjudication, judicial reasoning,</text>
    <text x="0" y="283" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#ece8df" fill-opacity=".84">and computational law.</text>
  </g>

