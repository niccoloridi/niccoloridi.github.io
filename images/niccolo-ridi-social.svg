        <rect x="69" y="68" width="12" height="61" opacity=".38"/><rect x="89" y="83" width="12" height="46" opacity=".32"/>
        <rect x="109" y="48" width="12" height="81" opacity=".58"/><rect x="129" y="61" width="12" height="68" opacity=".46"/>
