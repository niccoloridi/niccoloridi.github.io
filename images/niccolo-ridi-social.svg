<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Niccolò Ridi — Public International Law</title>
  <desc id="desc">A dark typographic card with four generative panels representing profile, practice, research, and data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080a"/>
      <stop offset=".68" stop-color="#101013"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="48%" r="46%">
      <stop offset="0" stop-color="#d7a13b" stop-opacity=".13"/>
      <stop offset="1" stop-color="#d7a13b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="627" fill="url(#background)"/>
  <rect width="1200" height="627" fill="url(#glow)"/>
  <rect x="31" y="31" width="1138" height="565" fill="none" stroke="#d7a13b" stroke-opacity=".35"/>
  <line x1="65" y1="102" x2="1135" y2="102" stroke="#2a2a2f"/>
  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="2.2" fill="#8d887e">
