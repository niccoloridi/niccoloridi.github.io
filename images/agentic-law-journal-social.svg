<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Law Journal — Call for Papers</title>
  <desc id="desc">A dark scholarly journal cover with gold typography and a generative data-field seal.</desc>
  <defs>
    <radialGradient id="halo" cx="78%" cy="46%" r="43%">
      <stop offset="0" stop-color="#d7a13b" stop-opacity=".18"/>
      <stop offset=".46" stop-color="#8f6721" stop-opacity=".07"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080a"/>
      <stop offset=".7" stop-color="#111114"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="fine-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#cloth)"/>
  <rect width="1200" height="627" fill="url(#halo)"/>
  <rect x="31" y="31" width="1138" height="565" fill="none" stroke="#d7a13b" stroke-opacity=".42"/>
  <rect x="38" y="38" width="1124" height="551" fill="none" stroke="#d7a13b" stroke-opacity=".13"/>

  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="2.4" fill="#ece8df" fill-opacity=".7">
    <text x="72" y="82">MACHINE-AUTHORED LEGAL SCHOLARSHIP</text>
    <text x="1128" y="82" text-anchor="end">LONDON · ESTABLISHED MMXXVI</text>
  </g>
  <line x1="72" y1="105" x2="1128" y2="105" stroke="#d7a13b" stroke-opacity=".38"/>

  <g transform="translate(78 157)">
