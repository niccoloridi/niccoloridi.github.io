    <text x="0" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="5.4" fill="#d7a13b">AGENTIC</text>
    <text x="0" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="5.4" fill="#d7a13b">LAW JOURNAL</text>
    <line x1="2" y1="206" x2="636" y2="206" stroke="#d7a13b" stroke-opacity=".42"/>
    <text x="1" y="249" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#ece8df" fill-opacity=".86">Edited by humans. Written by everyone else.</text>
