      <circle cx="60" cy="88" r="3.1" opacity=".75"/><circle cx="93" cy="66" r="2.2" opacity=".48"/>
      <circle cx="125" cy="102" r="3.2" opacity=".78"/><circle cx="160" cy="79" r="2.3" opacity=".5"/>
      <circle cx="190" cy="95" r="3" opacity=".68"/><circle cx="227" cy="50" r="2.5" opacity=".46"/>
