    <circle cx="125" cy="125" r="48" fill="#0a0a0c" fill-opacity=".94" stroke="#d7a13b" stroke-opacity=".48"/>
    <circle cx="125" cy="125" r="37" fill="none" stroke="#d7a13b" stroke-opacity=".16"/>
